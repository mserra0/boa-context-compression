model:
  mamba_model_name: "state-spaces/mamba2-1.3b"
  llm_model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  compressor_type: "mamba2"
  stride: 10
  objective: "lm"
  prompt_mode: "kv"
training:
  max_steps: 200
  warmup_steps: 5
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  eval_interval: 200
  save_interval: 1000
  log_interval: 5
  gradient_clip_max_norm: 1.0
  gradient_accumulation_steps: 4
  overfit: true
dataloading:
  packing: "token_budget"
  tokens_per_batch: 8192
  max_seqs_per_batch: 32
data:
  data_dir: "/path/to/data/fineweb-edu-10B/sample/10BT"
  compressor_tokenizer_name: "EleutherAI/gpt-neox-20b"
  min_doc_tokens: 320
  max_ctx: 1024
  max_pred: 256
  val_samples: 16
  max_samples: 64
  seed: 42
paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "/path/to/outputs"
wandb:
  project: "boa"
  entity: null
  name: "lm-pretrain-overfit-kv"
  tags: ["pretrain", "mamba2", "kv", "fineweb"]
