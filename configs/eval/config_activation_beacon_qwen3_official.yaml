activation_beacon:
  beacon_backend: "qwen3_official"
  # Fine-tuned Activation Beacon checkpoint to evaluate (a local path, e.g. on offline cluster nodes).
  model_name_or_path: "/path/to/checkpoints/activation_beacon/<finetune_run_dir>/checkpoint-epoch-1"
  teacher_model_name_or_path: "/path/to/checkpoints/qwen3_1_7b_fullft/final"
  run_name: "activation_beacon_qwen3_17b_mrqa_r16"
  dtype: "bf16"
  attn_implementation: "sdpa"
  local_files_only: false
  max_input_tokens: 20000
  max_new_tokens: 80
  # Matches the authors' LongBench QA evaluation: stop concise QA generations at newline.
  newline_as_eos: true

  # Preserve checkpoint window/stride/ratio values by leaving these null.
  # adapt-1024 matches the authors' evaluation recipe.
  beacon_window: null
  beacon_stride: null
  beacon_attn: null
  beacon_ratio: 16
  beacon_ratio_mix: "fixed"
  beacon_param: null
  beacon_sink_size: null
  beacon_attend_prev: null
  beacon_pos: null
  beacon_parallel_window: 1

judge:
  model: "Qwen/Qwen3-32B"
  base_url: "http://localhost:8080/v1"
  max_concurrent: 32
  max_tokens: 128
  temperature: 1.0
  prompt_template: |
    You are evaluating a Question Answering system. Decide whether the Predicted
    Answer contains the core answer requested by the Question and matches the
    Reference Answer. Ignore harmless extra explanation.

    Respond only with JSON containing "Reason" and binary "Score".
    Question: {question}
    Reference Answer: {references}
    Predicted Answer: {prediction}

datasets:
  squad: false
  mrqa_squad: true
  mrqa_newsqa: true
  mrqa_trivia: true
  mrqa_hotpot: true
  mrqa_data_dir: "/path/to/data/MRQA/dev"
  max_samples: 500

inference:
  batch_size: 1

# LongBench-style MRQA scoring: normalize answers, compute token-level QA F1,
# take max over gold answers, and report 100 * mean(F1). Use
# "judge_accuracy" for LLM-judge binary scoring (needs the judge section above).
evaluation:
  metric: "qa_f1"
  # Keep raw generations, but score an extracted gold-matching answer span when
  # verbose teacher outputs contain the correct answer.
  clean_predictions: true

force_recompute_baselines: true
force_recompute_experiment: true

wandb:
  project: "boa"
  entity: null
  tags: ["eval", "activation-beacon", "baseline"]
