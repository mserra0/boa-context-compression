# Qwen3 FullFT baseline on MRQA — multi-node (cluster paths).
# Submit: sbatch scripts/utils/mn5_baseline_fullft.slurm configs/baselines/mn5_qwen3_1_7b_fullft.yaml
# Model must be pre-cached (the Slurm script runs with HF_HUB_OFFLINE=1).

model:
  llm_model_name: "Qwen/Qwen3-1.7B"
  max_seq_len: 1024

data:
  data_dir: "/path/to/data/MRQA"
  dev_dir: "/path/to/data/MRQA/dev"
  max_samples: null           # cap train (null = full)
  max_eval_samples: 10000      # cap dev for fast/stable eval_loss (null = full dev set)
  use_context: true
  seed: 42

# Passed straight to transformers.TrainingArguments (resume_from + patience popped out).
training:
  output_dir: "/path/to/checkpoints/qwen3_1_7b_fullft"
  # 8 nodes x 4 GPU x bs16 x accum1 = GBS 512 -> ~977 steps/epoch over ~500k MRQA samples.
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 4.0e-5       # scaled down for the finer GBS-512 gradients
  weight_decay: 0.01
  warmup_steps: 100            # ~5% of 977 steps
  # Cosine decay to 10% of peak LR (min_lr_rate = peak * 0.1).
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs: {min_lr_rate: 0.1}
  max_grad_norm: 1.0
  logging_steps: 5            # smooth train-loss curve in wandb
  logging_first_step: true
  disable_tqdm: true
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  bf16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  report_to: "wandb"
  resume_from: null           # null=fresh | "latest"=auto-find newest checkpoint-<step> in output_dir | <path>
  start_from: null            # weights-only warm start from an HF dir (ignored if resuming)
  patience: 2                 # 2 eval windows = 200 steps of no eval_loss improvement -> stop

paths:
  final_checkpoint_dir: "/path/to/checkpoints/qwen3_1_7b_fullft/final"

# Offline top-k teacher-logit dump (free greedy generation, multi-GPU via torchrun).
dump:
  splits: ["train"]
  top_k: 50
  max_new_tokens: 80          # match online teacher (config_01CompDIST max_new_tokens)
  batch_size: 16
  shard_size: 2048
  output_dir: "/path/to/logits/qwen3_1_7b_fullft"

wandb:
  project: "boa"
  name: "qwen3_1.7b_fullft_multinode"
  tags: ["baseline", "fullft", "qwen3"]
