# configs/baselines/coverage_sweep.yaml
model:
  max_seq_len: 1024

data:
  # Directory holding the six MRQA dev files as <Split>.jsonl.gz (SQuAD.jsonl.gz, ...).
  data_dir: "/path/to/data/MRQA/dev"
  seed: 42
  use_context: true
  max_samples: 500

paths:
  final_checkpoint_dir: "/path/to/checkpoints/qwen3_1_7b_fullft/final"

coverage:
  splits: [SQuAD, NewsQA, TriviaQA, HotpotQA, SearchQA, NaturalQuestions]
  k_grid: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000]
  max_new_tokens: 32
  batch_size: 16
  output_dir: "evals/coverage"
