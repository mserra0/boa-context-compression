# ICAE fine-tuning stage 2: gold-answer cross-entropy, QUESTION-BLIND compression
# (full run).
#
# Unlike icae_finetune_gt_4x.yaml, which compresses the question TOGETHER with the
# context into memory (so the encoder can spend its whole slot budget on "the answer to
# this known question" rather than on general-purpose document compression, an easier
# task), this config compresses the context only.
#
# compress_question: false makes the compressor's input CONTEXT ONLY (see
# CompressionDataset._build_compressor_text) -- no chat template, no system prompt,
# matching the raw-text format the AE/LM pretrain checkpoint already expects. The
# question reaches the decoder only as literal, uncompressed tokens inserted between
# the memory slots and the answer: [MEM(context only) | question(literal) | answer[:-1]].
# This matches the original ICAE paper's fine-tuning objective (L_FT = max P(r|m, p),
# memory m and literal prompt p are separate terms) and SAC's task formulation.
#
# This is a genuinely question-blind design, NOT the same as PromptDestiller's Mamba
# "B-ctx" (compress_question=False + student_template=wrapped) -- that mode still lets
# the question condition the compressor's raw input (see
# docs/architecture/student-templates.md on the `main` branch). ICAE's compressor here never sees the
# question at all.
#
# start_from points at the same FineWeb ae_lm pretrain checkpoint as icae_finetune_gt_4x.yaml
# (pretraining uses raw FineWeb text without questions, so it is shared between both variants).
model:
  llm_model_name: &llm_name "/path/to/checkpoints/qwen3_1_7b_fullft/final"
  encoder_model_name: *llm_name
  mamba_model_name: null              # unused for ICAE; kept so config validator passes
  compressor_type: "icae"
  icae_objective: "gt"
  compress_question: false
  compression_ratio: 0.25
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.05
  temperature: 2.0
  max_new_tokens: 80

training:
  num_epochs: 10000
  patience: 6
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler_epochs: 100
  warmup_steps: 400
  log_interval: 100   # steps
  save_interval: 1    # epochs
  gradient_accumulation_steps: 4
  gradient_clip_max_norm: 2.0
  lr_scheduler_eta_min: 1.0e-6
  profile: False
  profile_range: [3]
  resume_from: null
  # pre-trained ICAE compressor (FineWeb ae_lm pretrain, not the MRQA-continuation runs)
  start_from: "/path/to/checkpoints/<pretrain_run_dir>/best_model.pt"
  artifact_every_n_epochs: null
  distributed: True

data:
  dataset_name: &dataset_name "MRQA"
  data_dir: "/path/to/data/MRQA"
  max_samples: null
  max_seq_len: 1024
  seed: 42
  use_context: True

paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_mn5"

wandb:
  project: "boa"
  entity: null
  name: "ft_ICAE_gt_4x_bctx_Qwen3-1.7B-FullFT"
  tags: ["train", "full", "DDP", "qwen3FullFT", "ICAE", "bctx", "question-blind"]
  dataset: *dataset_name
  llm_model_name: *llm_name
  encoder_model_name: *llm_name
