# Model configuration
model:
  mamba_model_name: &ssm_name "state-spaces/mamba2-1.3b"
  llm_model_name: &llm_name "Qwen/Qwen2.5-0.5B-Instruct"
  compressor_type: "mamba2"
  compressor_tokenizer_name: "EleutherAI/gpt-neox-20b"
  stride: 10
  temperature: 2.0
  max_new_tokens: 80
  loss_type: "confidence_kl"  # "kl" | "confidence_kl"
  confidence_mode: "max_prob"  # "max_prob" | "neg_entropy"

# Training configuration
training:
  num_epochs: 10000
  patience: 6
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler_epochs: 50
  warmup_steps: 2000
  log_interval: 5
  save_interval: 10
  gradient_accumulation_steps: 4
  gradient_clip_max_norm: 1.0
  lr_scheduler_eta_min: 1.0e-8
  profile: False
  profile_range: [3]
  resume_from: null
  start_from: null
  artifact_every_n_epochs: null
  distributed: True

# Data configuration
data:
  dataset_name: &dataset_name "MRQA"
  data_dir: "/path/to/data/MRQA"
  max_samples: null
  max_seq_len: 1024
  seed: 42
  use_context: True

# Paths
paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_mn5"

# WandB configuration
wandb:
  project: "boa"
  entity: null
  name: "01Comp_QC_Mamba2L_ConfKL_MaxProb"
  tags: ["mamba2", "packed", "DDP", "prompt-ordering", "Mamba2_1.3B", "confidence_kl", "max_prob"]
  dataset: *dataset_name
  mamba_model_name: *ssm_name
  llm_model_name: *llm_name
  kl_reduction: "batchmean+seq_norm"
