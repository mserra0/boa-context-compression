
# ICAE baseline 
# Encoder: Qwen2.5-0.5B-Instruct with LoRA adapters (r=128, same-arch as decoder)
# Decoder: frozen Qwen2.5-0.5B-Instruct
# Compression: n_mem=52 memory slots ≈ 10x for 512-token contexts (matches compression_ratio=0.1)
# Loss: autoencoding cross-entropy (reconstruct original context from memory slots)

model:
  llm_model_name: &llm_name "Qwen/Qwen2.5-0.5B-Instruct"
  encoder_model_name: *llm_name       # same arch as decoder, adapted with LoRA
  mamba_model_name: null              # unused for ICAE; kept so config validator passes
  compressor_type: "icae"
  icae_objective: "ae"               # "ae" | "gt" | "distill" — see config_ICAE_ftgt.yaml / config_ICAE_ftdist.yaml
  # loss_type: "kl" # only relevant for distillation objective (see config_ICAE_ftdist.yaml)
  compression_ratio: 0.1             # not used by ICAE - instead, should adjust n_mem to be 0.1 of max_seq_len
  n_mem: 52                          # ceil(512 * 0.1) ≈ 52 → matches Mamba 10x compression
  lora_r: 128                        # value from original ICAE paper
  lora_alpha: 256                    # conventional heuristic suggests r*2
  lora_dropout: 0.05
  temperature: 2.0                   # unused for reconstruction loss; kept for interface compat
  max_new_tokens: 80

# Training
training:
  num_epochs: 10000
  patience: 1
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler_epochs: 200
  warmup_steps: 200
  log_interval: 5
  save_interval: 50
  gradient_accumulation_steps: 2
  gradient_clip_max_norm: 2.0
  lr_scheduler_eta_min: 1.0e-8
  profile: False
  profile_range: [3]
  resume_from: null
  start_from: null
  artifact_every_n_epochs: null
  distributed: True

# Data 
data:
  dataset_name: &dataset_name "MRQA"
  data_dir: "/path/to/data/MRQA"
  max_samples: null
  max_seq_len: 512
  seed: 42
  use_context: True

# Paths
paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_icae"

# WandB
wandb:
  project: "boa"
  entity: null
  name: "ICAE_n52_Qwen05B"
  tags: ["icae", "baseline", "reconstruction", "MRQA"]
  dataset: *dataset_name
  llm_model_name: *llm_name
  encoder_model_name: *llm_name
