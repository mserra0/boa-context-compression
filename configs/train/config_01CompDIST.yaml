
# Model configuration
model:
  mamba_model_name: &ssm_name "state-spaces/mamba-370m-hf"
  llm_model_name: &llm_name "Qwen/Qwen2.5-0.5B-Instruct"
  stride: 10
  temperature: 2.0
  max_new_tokens: 80
  loss_type: "kl"              # "kl" | "confidence_kl"
  confidence_mode: "max_prob"  # "max_prob" | "neg_entropy" (used when loss_type = confidence_kl)
  compile_llm: true            # compile inner LLM backbone (dynamic=True); ~minutes warmup, faster steps on long runs

# Training configuration
training:
  num_epochs: 10000 
  patience: 1
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler_epochs: 200
  warmup_steps: 200
  log_interval: 5
  save_interval: 50
  gradient_accumulation_steps: 2
  gradient_clip_max_norm: 1.0
  lr_scheduler_eta_min: 1.0e-8
  profile: False
  profile_range: [3]
  resume_from: null #"/path/to/checkpoints/<run_dir>/best_model.pt"
  start_from: null
  artifact_every_n_epochs: null
  distributed: True

# Data configuration
data:
  dataset_name: &dataset_name "MRQA"
  data_dir: "/path/to/data/MRQA"
  max_samples: null
  max_seq_len: 512
  seed: 42
  use_context: True

# Paths
paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_test"

# WandB configuration
wandb:
  project: "boa"
  entity: null
  name: "01CompDIST"
  tags: ["mamba", "DDP"]
  dataset: *dataset_name
  mamba_model_name: *ssm_name
  llm_model_name: *llm_name
  kl_reduction: "batchmean+seq_norm"

# Token-budget packing (Mamba2 only). Default 'none' keeps fixed-batch behavior.
# dataloading:
#   packing: none            # none | token_budget
#   tokens_per_batch: 4096   # pack budget; only used when packing=token_budget
#   max_seqs_per_batch: 32   # caps dynamic LLM batch N (docs per pack)
