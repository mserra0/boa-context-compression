# ABLATION 8x — Encoder x Projection cell: Mamba-1 + KV injection.
# LM pretraining (continuation CE, no KD). Mamba1 1.4B, left-padded [B,I] (no packing).
# Soft prompts injected as past_key_values (prompt_mode: kv) via the kv_projector.
# Frozen decoder / KD teacher = FullFT Qwen3-1.7B (SAME teacher across every ablation arm).
# Pairs with finetune/m1_kv_kd.yaml. Runs on `main` (kv + mamba1 supported).
model:
  mamba_model_name: &ssm_name "state-spaces/mamba-1.4b-hf"
  llm_model_name: &llm_name "/path/to/checkpoints/qwen3_1_7b_fullft/final"
  compressor_type: "mamba"
  stride: 8
  objective: "lm"
  prompt_mode: "kv"

training:
  max_steps: 10000
  warmup_steps: 50
  batch_size: 3
  learning_rate: 1.0e-4
  weight_decay: 0.01
  eval_interval: 50
  save_interval: 100
  log_interval: 5
  gradient_clip_max_norm: 1.0
  gradient_accumulation_steps: 4

data:
  data_dir: "/path/to/data/fineweb-edu-10B/sample/100BT"
  compressor_tokenizer_name: "EleutherAI/gpt-neox-20b"
  min_doc_tokens: 320
  max_ctx: 1024
  max_pred: 256
  val_samples: 2000
  max_samples: null
  seed: 42

paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_mn5"

wandb:
  project: "boa"
  entity: null
  name: "ABL_8x_pretrain_LM_Mamba1_kv_Qwen3-1.7B"
  tags: ["ablation", "8xComp", "pretrain", "lm", "KV-Prompt", "mamba1", "padded", "fineweb", "qwen3FullFT", "DDP"]
  mamba_model_name: *ssm_name
  llm_model_name: *llm_name
