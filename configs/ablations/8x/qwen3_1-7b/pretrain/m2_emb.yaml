# ABLATION 8x — Encoder x Projection cell: Mamba-2 + Embedding injection.
# LM pretraining (continuation CE, no KD). Mamba2 1.3B, packed [1,T] (token-budget).
# Soft prompts prepended as INPUT EMBEDS (prompt_mode: embed).
# Frozen decoder / KD teacher = FullFT Qwen3-1.7B (SAME teacher across every ablation arm).
# Pairs with finetune/m2_emb_kd.yaml (= Table 2 "w/o KV projection"). Runs on `main`.
model:
  mamba_model_name: &ssm_name "state-spaces/mamba2-1.3b"
  llm_model_name: &llm_name "/path/to/checkpoints/qwen3_1_7b_fullft/final"
  compressor_type: "mamba2"
  stride: 8
  objective: "lm"
  prompt_mode: "embed"

training:
  max_steps: 10000
  warmup_steps: 50
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  eval_interval: 50
  save_interval: 100
  log_interval: 5
  gradient_clip_max_norm: 1.0
  gradient_accumulation_steps: 4

dataloading:
  packing: "token_budget"
  tokens_per_batch: 4096
  max_seqs_per_batch: 32

data:
  data_dir: "/path/to/data/fineweb-edu-10B/sample/100BT"
  compressor_tokenizer_name: "EleutherAI/gpt-neox-20b"
  min_doc_tokens: 320
  max_ctx: 1024
  max_pred: 256
  val_samples: 2000
  max_samples: null
  seed: 42

paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_mn5"

wandb:
  project: "boa"
  entity: null
  name: "ABL_8x_pretrain_LM_Mamba2_emb_Qwen3-1.7B"
  tags: ["ablation", "8xComp", "pretrain", "lm", "embed-prompt", "mamba2", "packed", "fineweb", "qwen3FullFT", "DDP"]
  mamba_model_name: *ssm_name
  llm_model_name: *llm_name
