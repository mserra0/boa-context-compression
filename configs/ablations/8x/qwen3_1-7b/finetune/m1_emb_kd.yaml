# ABLATION 8x — Encoder x Projection cell: Mamba-1 + Embedding injection, KD finetune.
# MRQA KD finetune warm-started from the matching LM embed-pretrain (pretrain/m1_emb.yaml).
# Frozen LLM / KD teacher = FullFT Qwen3-1.7B (SAME teacher across every arm).
model:
  mamba_model_name: &ssm_name "state-spaces/mamba-1.4b-hf"
  llm_model_name: &llm_name "/path/to/checkpoints/qwen3_1_7b_fullft/final"
  compressor_type: "mamba"
  compressor_tokenizer_name: "EleutherAI/gpt-neox-20b"
  prompt_mode: "embed"
  student_template: "wrapped"
  compress_question: false
  stride: 8
  temperature: 2.0
  max_new_tokens: 80
  loss_type: "kl"
  compile_llm: false

training:
  num_epochs: 10000
  patience: 4
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler_epochs: 100
  warmup_steps: 400
  log_interval: 1
  save_interval: 10
  gradient_accumulation_steps: 2
  gradient_clip_max_norm: 2.0
  lr_scheduler_eta_min: 1.0e-6
  profile: False
  profile_range: [3]
  resume_from: null
  # Set to the run directory written by pretrain/m1_emb.yaml (a timestamped directory under checkpoint_dir).
  start_from: "/path/to/checkpoints/<pretrain_run_dir>/best_model.pt"
  artifact_every_n_epochs: null
  distributed: True

data:
  dataset_name: &dataset_name "MRQA"
  data_dir: "/path/to/data/MRQA"
  max_samples: null
  max_seq_len: 1024
  seed: 42
  use_context: True

paths:
  checkpoint_dir: "/path/to/checkpoints"
  output_dir: "./outputs_mn5"

wandb:
  project: "boa"
  entity: null
  name: "ABL_8x_ft_KD_Mamba1_emb"
  tags: ["ablation", "8xComp", "train", "kd", "embed", "mamba1", "wrapped", "bctx", "fromPretrain", "qwen3FullFT", "DDP"]
  dataset: *dataset_name
  mamba_model_name: *ssm_name
  llm_model_name: *llm_name
  kl_reduction: "valid_mean_per_tok"
