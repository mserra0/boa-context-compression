[project]
name = "boa-sac-baseline"
version = "0.1.0"
description = "SAC baseline for Boa: pretraining, MRQA fine-tuning and evaluation of contextual semantic anchors."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.11.0",
    "colorama>=0.4.6",
    "datasets>=4.4.0",
    "deepspeed>=0.19.2",
    "numpy>=2.3.4",
    "openai>=1.0.0",
    "pyarrow>=22.0.0",
    "py-cpuinfo>=9.0.0",
    "pytest>=8.4.2",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.40,<5",
    "wandb>=0.22.3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
