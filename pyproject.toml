[project]
name = "boa-context-compression"
version = "0.1.0"
description = "Boa ablation: off-policy knowledge-distillation pretraining of the Mamba compressor."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.11.0",
    "causal-conv1d>=1.6.0",
    "colorama>=0.4.6",
    "datasets>=4.4.0",
    "mamba-ssm>=2.3.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3.4",
    "openai>=1.0.0",
    "packaging>=25.0",
    "protobuf>=6.33.0",
    "pytest>=8.4.2",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "seaborn>=0.13.2",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "vllm>=0.22.0",
    "wandb>=0.22.3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
